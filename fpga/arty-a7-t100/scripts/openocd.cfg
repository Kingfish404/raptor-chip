# Normal OpenOCD target using the merged standard SBA master.
source [find tap.cfg]
target create rapt.cpu riscv -chain-position rapt.tap -coreid 0
rapt.cpu configure -work-area-size 0
riscv set_mem_access sysbus
riscv set_enable_virtual off
riscv set_enable_virt2phys off
gdb_port disabled
tcl_port disabled
telnet_port disabled
