# The SoC TAP uses a separate CMSIS-DAP probe, never the FPGA configuration TAP.
source [find interface/cmsis-dap.cfg]
transport select jtag
# The probe serial is supplied by the caller: -c "set RAPT_PROBE_SERIAL <serial>".
if {![info exists RAPT_PROBE_SERIAL] || $RAPT_PROBE_SERIAL eq ""} {
    error "set RAPT_PROBE_SERIAL to the CMSIS-DAP probe serial for the SoC's JTAG before tap.cfg"
}
adapter serial $RAPT_PROBE_SERIAL
adapter speed 500
reset_config none
jtag newtap rapt tap -irlen 5 -expected-id 0x10001913

proc rapt_dmi {address value operation} {
    irscan rapt.tap 0x11
    set request [expr {(wide($address) << 34) | (wide($value & 0xffffffff) << 2) | $operation}]
    drscan rapt.tap 41 [format 0x%011x $request]
    runtest 4
    set reply [expr 0x[drscan rapt.tap 41 0]]
    runtest 4
    if {($reply & 3) != 0} {error [format "DMI response error %011x" $reply]}
    return [expr {($reply >> 2) & 0xffffffff}]
}

proc rapt_halt {} {
    rapt_dmi 0x10 1 2
    rapt_dmi 0x10 0x80000001 2
    for {set count 0} {$count < 100} {incr count} {
        if {([rapt_dmi 0x11 0 1] & 0x300) == 0x300} {return}
        runtest 10
    }
    error "halt timed out"
}

proc rapt_resume {} {
    rapt_dmi 0x10 0x40000001 2
    for {set count 0} {$count < 100} {incr count} {
        if {([rapt_dmi 0x11 0 1] & 0xc00) == 0xc00} {return}
    }
    error "resume timed out"
}

proc rapt_reg_read {number} {
    rapt_dmi 0x17 [expr {0x00220000 | $number}] 2
    set status [rapt_dmi 0x16 0 1]
    if {$status & 0x700} {error [format "abstract read %04x: %08x" $number $status]}
    return [rapt_dmi 4 0 1]
}

proc rapt_reg_write {number value} {
    rapt_dmi 4 $value 2
    rapt_dmi 0x17 [expr {0x00230000 | $number}] 2
    set status [rapt_dmi 0x16 0 1]
    if {$status & 0x700} {error [format "abstract write %04x: %08x" $number $status]}
}
