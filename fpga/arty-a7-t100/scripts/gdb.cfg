source [find tap.cfg]
bindto 127.0.0.1
target create rapt.cpu riscv -chain-position rapt.tap
rapt.cpu configure -work-area-size 0
gdb_port 3333
tcl_port disabled
telnet_port disabled
# Standard physical SBA is included in the current bitstream.
riscv set_mem_access sysbus
riscv set_enable_virtual off
riscv set_enable_virt2phys off
