name: Benchmark (AM + bare metal + pk + ysyxSoC)

# Combined performance / functional benchmark workflow:
#   - rv-benchmark / rv32-cpu-tests   : abstract-machine on the Raptor
#   - app-pk-coremark                 : pk-hosted hello + CoreMark
#   - app-pk-embench                  : pk/MMU-hosted Embench-IoT suite
#   - app-baremetal-embench           : bare-metal Embench-IoT suite
#   - ysyxsoc-benchmark / ysyxsoc-cpu-tests : ysyxSoC integration
# STA / PPA evaluation lives in the dedicated `sta.yaml` workflow.

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "hdl/**"
      - "sim/**"
      - "abstract-machine/**"
      - "app/**"
      - ".github/scripts/**"
      - ".github/workflows/benchmark.yaml"
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - "hdl/**"
      - "sim/**"
      - "abstract-machine/**"
      - "app/**"
      - ".github/scripts/**"
      - ".github/workflows/benchmark.yaml"
  workflow_dispatch:

# Cancel in-flight runs on the same ref/PR when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rv-benchmark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build NEMU (ref) and rv32
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      - name: Run microbench rv32
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make microbench-rv32 ARGS="-b -n" MAINARGS=test \
            2>&1 | tee /tmp/microbench-rv32.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-rv32.log > .github/results/microbench-rv32.txt

      - name: Run microbench rv32e
        shell: bash -l {0}
        run: |
          make microbench-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n" MAINARGS=test \
            2>&1 | tee /tmp/microbench-rv32e.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-rv32e.log > .github/results/microbench-rv32e.txt

      - name: Run coremark rv32
        shell: bash -l {0}
        run: |
          make coremark-rv32 ARGS="-b -n" \
            2>&1 | tee /tmp/coremark-rv32.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-rv32.log > .github/results/coremark-rv32.txt

      - name: Run coremark rv32e
        shell: bash -l {0}
        run: |
          make coremark-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n" \
            2>&1 | tee /tmp/coremark-rv32e.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-rv32e.log > .github/results/coremark-rv32e.txt

      - name: Run RISC-V Architecture Test rv32
        shell: bash -l {0}
        run: |
          make archtest-rv32 ARGS="-b -n" \
            2>&1 | tee /tmp/archtest-rv32.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-rv32.log > .github/results/archtest-rv32.txt

      - name: Run RISC-V Architecture Test rv32e
        shell: bash -l {0}
        run: |
          make archtest-rv32e ARGS="-b -n" \
            2>&1 | tee /tmp/archtest-rv32e.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-rv32e.log > .github/results/archtest-rv32e.txt

      - name: Generate benchmark summary
        run: bash .github/scripts/generate-summary.sh .github/results
          .github/benchmark-results.json "$GITHUB_STEP_SUMMARY"

      - name: PMU details
        if: always()
        run: |
          bash .github/scripts/parse-pmu.sh \
            "CoreMark rv32" /tmp/coremark-rv32.log \
            "CoreMark rv32e" /tmp/coremark-rv32e.log \
            "MicroBench rv32" /tmp/microbench-rv32.log \
            "MicroBench rv32e" /tmp/microbench-rv32e.log \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            .github/benchmark-results.json
            .github/results/
          retention-days: 90
          overwrite: true

  rv32-cpu-tests:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build RV32 with difftest and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-difftest
          make config-nemu32-ref
      - name: cpu-tests rv32e
        shell: bash -l {0}
        run: make cpu-tests-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n"
      - name: cpu-tests rv32
        shell: bash -l {0}
        run: make cpu-tests-rv32 NPC_ARCH=riscv32-npc ARGS="-b -n"

  ysyxsoc-benchmark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Generate ysyxSoC
        shell: bash -l {0}
        run: make -C ./third_party/kingfish404/ysyxSoC/ dev-init verilog
      - name: Build simulator (ysyxSoC config) and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-ysyxsoc
          make config-nemu32-ref
      - name: Run microbench riscv32-ysyxsoc
        shell: bash -l {0}
        run: make microbench-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/mb-soc.log
      - name: Run microbench riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/benchmarks/microbench ARCH=riscv32e-ysyxsoc run mainargs="test" ARGS="-b -n" 2>&1 | tee /tmp/mb-soce.log
      - name: Run coremark riscv32-ysyxsoc
        shell: bash -l {0}
        run: make coremark-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/cm-soc.log
      - name: Run coremark riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/benchmarks/coremark_eembc ARCH=riscv32e-ysyxsoc run ARGS="-b -n" 2>&1 | tee /tmp/cm-soce.log
      - name: ysyxSoC benchmark summary
        shell: bash -l {0}
        run: |
          extract_ipc() { grep -oP 'IPC:\s*\K[0-9.]+' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_score() { grep -oP '\d+(?=(/1000)? Marks)' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_trap() { grep -oE 'HIT (GOOD|BAD) TRAP' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          {
            echo ""
            echo "## ysyxSoC Benchmark Results"
            echo "| Benchmark | Target | Score | IPC | Status |"
            echo "|-----------|--------|-------|-----|--------|"
            echo "| CoreMark  | riscv32-ysyxsoc  | $(extract_score /tmp/cm-soc.log) | $(extract_ipc /tmp/cm-soc.log) | $(extract_trap /tmp/cm-soc.log) |"
            echo "| CoreMark  | riscv32e-ysyxsoc | $(extract_score /tmp/cm-soce.log) | $(extract_ipc /tmp/cm-soce.log) | $(extract_trap /tmp/cm-soce.log) |"
            echo "| MicroBench | riscv32-ysyxsoc  | $(extract_score /tmp/mb-soc.log) | $(extract_ipc /tmp/mb-soc.log) | $(extract_trap /tmp/mb-soc.log) |"
            echo "| MicroBench | riscv32e-ysyxsoc | $(extract_score /tmp/mb-soce.log) | $(extract_ipc /tmp/mb-soce.log) | $(extract_trap /tmp/mb-soce.log) |"
          } >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/parse-pmu.sh \
            "CoreMark riscv32-ysyxsoc" /tmp/cm-soc.log \
            "CoreMark riscv32e-ysyxsoc" /tmp/cm-soce.log \
            "MicroBench riscv32-ysyxsoc" /tmp/mb-soc.log \
            "MicroBench riscv32e-ysyxsoc" /tmp/mb-soce.log \
            >> "$GITHUB_STEP_SUMMARY"

  ysyxsoc-cpu-tests:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Generate ysyxSoC
        shell: bash -l {0}
        run: make -C ./third_party/kingfish404/ysyxSoC/ dev-init verilog
      - name: Build simulator (ysyxSoC config) and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-ysyxsoc
          make config-nemu32-ref
      - name: cpu-tests riscv32-ysyxsoc
        shell: bash -l {0}
        run: make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/tests/cpu-tests
          ARCH=riscv32-ysyxsoc run ARGS="-b -n"
      - name: cpu-tests riscv32e-ysyxsoc
        shell: bash -l {0}
        run: make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/tests/cpu-tests
          ARCH=riscv32e-ysyxsoc run ARGS="-b -n"

  app-pk-coremark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Clone riscv-pk
        run: |
          mkdir -p third_party/riscv-software-src
          [ -d third_party/riscv-software-src/riscv-pk ] || \
            git clone --depth 1 https://github.com/riscv-software-src/riscv-pk \
              third_party/riscv-software-src/riscv-pk

      - name: Build NEMU reference and simulator
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      - name: Build pk
        shell: bash -l {0}
        run: make --no-print-directory -C app pk-build

      # ---- Hello world ----
      - name: Run hello
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make app-hello-rv32 ARGS="-b -n" 2>&1 | tee /tmp/app-hello.log

      # ---- CoreMark ----
      - name: Run CoreMark
        shell: bash -l {0}
        run: |
          make app-coremark-rv32 ARGS="-b -n" 2>&1 | tee /tmp/app-coremark.log

      # ---- Summary ----
      - name: Generate summary
        if: always()
        run: |
          # ---- Parse hello ----
          HELLO_TRAP=$(grep -oE 'HIT (GOOD|BAD) TRAP' /tmp/app-hello.log | head -1 || echo "UNKNOWN")
          HELLO_OK=$( [ "$HELLO_TRAP" = "HIT GOOD TRAP" ] && echo "PASS" || echo "FAIL" )
          HELLO_IPC=$(grep -oP 'IPC:\s*\K[0-9.]+' /tmp/app-hello.log | head -1 || echo "N/A")

          # ---- Parse CoreMark (bare-metal pk port) ----
          # The bare-metal port prints:
          #   CoreMark Size    : 666
          #   Total ticks      : <N>
          #   Total time (secs): <s>
          #   Iterations/Sec   : <n>     (integer-truncated)
          #   Iterations       : <n>
          # So we compute the standard CoreMark/MHz metric from PMU cycles:
          #   CoreMark/MHz = iterations * 1e6 / cycles
          CM_VALID=$(grep -cE 'Correct operation validated' /tmp/app-coremark.log || echo "0")
          CM_ITERS=$(grep -oP '^Iterations\s*:\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_TICKS=$(grep -oP '^Total ticks\s*:\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_SECS=$(grep -oP '^Total time \(secs\):\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_ITERSEC=$(grep -oP '^Iterations/Sec\s*:\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_IPC=$(grep -oP 'IPC:\s*\K[0-9.]+' /tmp/app-coremark.log | head -1 || echo "N/A")
          CM_CYCLES=$(grep -oP 'cycle:\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_INSTS=$(grep -oP '#inst:\s*\K\d+' /tmp/app-coremark.log | head -1 || echo "")
          CM_TRAP=$(grep -oE 'HIT (GOOD|BAD) TRAP' /tmp/app-coremark.log | head -1 || echo "UNKNOWN")
          CM_OK=$( [ "$CM_TRAP" = "HIT GOOD TRAP" ] && [ "$CM_VALID" -ge 1 ] && echo "PASS" || echo "FAIL" )

          CM_CMARK_PER_MHZ="N/A"
          if [ -n "$CM_ITERS" ] && [ -n "$CM_CYCLES" ] && [ "$CM_CYCLES" -gt 0 ]; then
            CM_CMARK_PER_MHZ=$(awk -v i="$CM_ITERS" -v c="$CM_CYCLES" \
              'BEGIN{ printf "%.3f", i*1e6/c }')
          fi

          # ---- Write summary ----
          {
            echo "## App Tests — CoreMark (pk on sim)"
            echo ""
            echo "### Overview"
            echo ""
            echo "| Test | Status | IPC | Details |"
            echo "|------|--------|-----|---------|"
            echo "| Hello | ${HELLO_OK} | ${HELLO_IPC} | ${HELLO_TRAP} |"
            echo "| CoreMark | ${CM_OK} | ${CM_IPC} | ${CM_CMARK_PER_MHZ} CoreMark/MHz, iters=${CM_ITERS:-N/A} |"
            echo ""

            # ---- CoreMark detail ----
            echo "### CoreMark"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| CoreMark/MHz (iters*1e6/cycles) | **${CM_CMARK_PER_MHZ}** |"
            echo "| Iterations | ${CM_ITERS:-N/A} |"
            echo "| Cycles | ${CM_CYCLES:-N/A} |"
            echo "| Instructions | ${CM_INSTS:-N/A} |"
            echo "| IPC | ${CM_IPC} |"
            echo "| Reported Total ticks | ${CM_TICKS:-N/A} |"
            echo "| Reported Total time (secs) | ${CM_SECS:-N/A} |"
            echo "| Reported Iterations/Sec | ${CM_ITERSEC:-N/A} |"
            echo "| Validation | $( [ "$CM_VALID" -ge 1 ] && echo 'Correct operation validated' || echo 'NOT VALIDATED' ) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # PMU details (collapsed)
          bash .github/scripts/parse-pmu.sh \
            "Hello (pk)" /tmp/app-hello.log \
            "CoreMark (pk)" /tmp/app-coremark.log \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-coremark-logs-${{ github.sha }}
          path: |
            /tmp/app-hello.log
            /tmp/app-coremark.log
          retention-days: 30
          overwrite: true

  app-baremetal-embench:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Build NEMU reference and simulator
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      # ---- Embench-IoT ----
      - name: Run Embench-IoT
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make app-embench-baremetal-run-rv32 ARGS="-b -n"

      # ---- Summary ----
      - name: Generate summary
        if: always()
        run: |
          report_rc=0
          make app-embench-baremetal-report-rv32 || report_rc=$?
          cat sim/build/default/logs/app/embench-baremetal-rv32.md \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$report_rc"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-embench-logs-${{ github.sha }}
          path: |
            sim/build/default/logs/app/embench-baremetal-rv32.log
            sim/build/default/logs/app/embench-baremetal-rv32.md
            sim/build/default/logs/app/embench-baremetal-rv32/
          retention-days: 30
          overwrite: true

  app-pk-embench:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Clone riscv-pk
        run: |
          mkdir -p third_party/riscv-software-src
          [ -d third_party/riscv-software-src/riscv-pk ] || \
            git clone --depth 1 https://github.com/riscv-software-src/riscv-pk \
              third_party/riscv-software-src/riscv-pk

      - name: Build NEMU reference, simulator, and pk
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32
          make --no-print-directory -C app pk-build

      - name: Run pk/MMU Embench-IoT
        shell: bash -l {0}
        run: make app-embench-pk-run-rv32 ARGS="-b -n"

      - name: Generate pk/MMU summary
        if: always()
        run: |
          report_rc=0
          make app-embench-pk-report-rv32 || report_rc=$?
          cat sim/build/default/logs/app/embench-pk-rv32.md \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$report_rc"

      - name: Upload pk/MMU logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-pk-embench-logs-${{ github.sha }}
          path: |
            sim/build/default/logs/app/embench-pk-rv32.log
            sim/build/default/logs/app/embench-pk-rv32.md
            sim/build/default/logs/app/embench-pk-rv32/
          retention-days: 30
          overwrite: true
