name: Benchmark (AM + bare metal + pk + ysyxSoC + random memory)

# Combined performance / functional benchmark workflow:
#   - rv-benchmark / rv32-cpu-tests   : abstract-machine on the Raptor
#   - app-pk-coremark                 : pk-hosted hello + CoreMark
#   - app-pk-embench                  : pk/MMU-hosted Embench-IoT suite
#   - app-baremetal-embench           : bare-metal Embench-IoT suite
#   - ysyxsoc-benchmark / ysyxsoc-cpu-tests : ysyxSoC wrapper integration
#   - sim-random-memory              : RV32/RV64 random AXI memory delays
# STA / PPA evaluation lives in the dedicated `sta.yaml` workflow.

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "hdl/**"
      - "sim/**"
      - "abstract-machine/**"
      - "app/**"
      - ".github/scripts/**"
      - ".github/workflows/benchmark.yaml"
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - "hdl/**"
      - "sim/**"
      - "abstract-machine/**"
      - "app/**"
      - ".github/scripts/**"
      - ".github/workflows/benchmark.yaml"
  workflow_dispatch:

# Cancel in-flight runs on the same ref/PR when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAPT_CONFIG: default

jobs:
  rv-benchmark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build NEMU (ref) and rv32
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      - name: Run microbench rv32
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make microbench-rv32 ARGS="-b -n" MAINARGS=test \
            2>&1 | tee /tmp/microbench-rv32.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-rv32.log > .github/results/microbench-rv32.txt

      - name: Run microbench rv32e
        shell: bash -l {0}
        run: |
          make microbench-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n" MAINARGS=test \
            2>&1 | tee /tmp/microbench-rv32e.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-rv32e.log > .github/results/microbench-rv32e.txt

      - name: Run coremark rv32
        shell: bash -l {0}
        run: |
          make coremark-rv32 ARGS="-b -n" \
            2>&1 | tee /tmp/coremark-rv32.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-rv32.log > .github/results/coremark-rv32.txt

      - name: Run coremark rv32e
        shell: bash -l {0}
        run: |
          make coremark-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n" \
            2>&1 | tee /tmp/coremark-rv32e.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-rv32e.log > .github/results/coremark-rv32e.txt

      - name: Run RISC-V Architecture Test rv32
        shell: bash -l {0}
        run: |
          make archtest-rv32 ARGS="-b -n" \
            2>&1 | tee /tmp/archtest-rv32.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-rv32.log > .github/results/archtest-rv32.txt

      - name: Run RISC-V Architecture Test rv32e
        shell: bash -l {0}
        run: |
          make archtest-rv32e ARGS="-b -n" \
            2>&1 | tee /tmp/archtest-rv32e.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-rv32e.log > .github/results/archtest-rv32e.txt

      - name: Generate benchmark summary
        run: bash .github/scripts/generate-summary.sh .github/results
          .github/benchmark-results.json "$GITHUB_STEP_SUMMARY"

      - name: PMU details
        if: always()
        run: |
          bash .github/scripts/parse-pmu.sh \
            "CoreMark rv32" /tmp/coremark-rv32.log \
            "CoreMark rv32e" /tmp/coremark-rv32e.log \
            "MicroBench rv32" /tmp/microbench-rv32.log \
            "MicroBench rv32e" /tmp/microbench-rv32e.log \
            >> "$GITHUB_STEP_SUMMARY"

  rv32-cpu-tests:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build RV32 with difftest and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-difftest
          make config-nemu32-ref
      - name: cpu-tests rv32e
        shell: bash -l {0}
        run: make cpu-tests-rv32 NPC_ARCH=riscv32e-npc ARGS="-b -n"
      - name: cpu-tests rv32
        shell: bash -l {0}
        run: make cpu-tests-rv32 NPC_ARCH=riscv32-npc ARGS="-b -n"

  ysyxsoc-benchmark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Set up JDK 17 for upstream ysyxSoC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate pinned upstream ysyxSoC
        shell: bash -l {0}
        run: |
          curl -fL --retry 3 https://github.com/com-lihaoyi/mill/releases/download/0.12.4/0.12.4 \
            -o "$RUNNER_TEMP/mill-0.12.4"
          make ysyxsoc-setup YSYXSOC_MILL="$RUNNER_TEMP/mill-0.12.4" YSYXSOC_JAVA_HOME="$JAVA_HOME"
      - name: Build simulator (ysyxSoC config) and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-ysyxsoc
          make config-nemu32-ref
      - name: Run microbench riscv32-ysyxsoc
        shell: bash -l {0}
        run: make microbench-ysyxsoc MAINARGS=test ARGS="-b -n" 2>&1 | tee /tmp/mb-soc.log
      - name: Run microbench riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make microbench-ysyxsoc YSYXSOC_ARCH=riscv32e-ysyxsoc MAINARGS=test ARGS="-b -n" 2>&1 | tee /tmp/mb-soce.log
      - name: Run coremark riscv32-ysyxsoc
        shell: bash -l {0}
        run: make coremark-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/cm-soc.log
      - name: Run coremark riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make coremark-ysyxsoc YSYXSOC_ARCH=riscv32e-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/cm-soce.log
      - name: ysyxSoC benchmark summary
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          bash .github/scripts/parse-benchmark.sh coremark /tmp/cm-soc.log > .github/results/coremark-ysyxsoc.txt
          bash .github/scripts/parse-benchmark.sh coremark /tmp/cm-soce.log > .github/results/coremark-ysyxsoce.txt
          extract_ipc() { grep -oP 'IPC:\s*\K[0-9.]+' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_score() { grep -oP '\d+(?=(/1000)? Marks)' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_trap() { grep -oE 'HIT (GOOD|BAD) TRAP' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          read_result() { grep -oP "^$2=\K.*" "$1" 2>/dev/null || echo "N/A"; }
          {
            echo ""
            echo "## ysyxSoC Benchmark Results"
            echo "| Benchmark | Target | Score | CoreMark/MHz | IPC | Status |"
            echo "|-----------|--------|-------|--------------|-----|--------|"
            echo "| CoreMark  | riscv32-ysyxsoc  | $(extract_score /tmp/cm-soc.log) | $(read_result .github/results/coremark-ysyxsoc.txt coremark_per_mhz) ($(read_result .github/results/coremark-ysyxsoc.txt iterations) iterations) | $(extract_ipc /tmp/cm-soc.log) | $(extract_trap /tmp/cm-soc.log) |"
            echo "| CoreMark  | riscv32e-ysyxsoc | $(extract_score /tmp/cm-soce.log) | $(read_result .github/results/coremark-ysyxsoce.txt coremark_per_mhz) ($(read_result .github/results/coremark-ysyxsoce.txt iterations) iterations) | $(extract_ipc /tmp/cm-soce.log) | $(extract_trap /tmp/cm-soce.log) |"
            echo "| MicroBench | riscv32-ysyxsoc  | $(extract_score /tmp/mb-soc.log) | N/A | $(extract_ipc /tmp/mb-soc.log) | $(extract_trap /tmp/mb-soc.log) |"
            echo "| MicroBench | riscv32e-ysyxsoc | $(extract_score /tmp/mb-soce.log) | N/A | $(extract_ipc /tmp/mb-soce.log) | $(extract_trap /tmp/mb-soce.log) |"
          } >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/parse-pmu.sh \
            "CoreMark riscv32-ysyxsoc" /tmp/cm-soc.log \
            "CoreMark riscv32e-ysyxsoc" /tmp/cm-soce.log \
            "MicroBench riscv32-ysyxsoc" /tmp/mb-soc.log \
            "MicroBench riscv32e-ysyxsoc" /tmp/mb-soce.log \
            >> "$GITHUB_STEP_SUMMARY"

  ysyxsoc-cpu-tests:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Set up JDK 17 for upstream ysyxSoC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate pinned upstream ysyxSoC
        shell: bash -l {0}
        run: |
          curl -fL --retry 3 https://github.com/com-lihaoyi/mill/releases/download/0.12.4/0.12.4 \
            -o "$RUNNER_TEMP/mill-0.12.4"
          make ysyxsoc-setup YSYXSOC_MILL="$RUNNER_TEMP/mill-0.12.4" YSYXSOC_JAVA_HOME="$JAVA_HOME"
      - name: Build simulator (ysyxSoC config) and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-rv32-ysyxsoc
          make config-nemu32-ref
      - name: cpu-tests riscv32-ysyxsoc
        shell: bash -l {0}
        run: make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/tests/cpu-tests
          ARCH=riscv32-ysyxsoc run ARGS="-b -n"
      - name: cpu-tests riscv32e-ysyxsoc
        shell: bash -l {0}
        run: make -C $RAPTOR_HOME/abstract-machine/app/am-kernels/tests/cpu-tests
          ARCH=riscv32e-ysyxsoc run ARGS="-b -n"

  sim-random-memory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        xlen: [32, 64]
        seed: [1, 42]
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
      SIM_RANDOM_DELAY: "31"
      SIM_RANDOM_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build NEMU reference
        shell: bash -l {0}
        run: make config-nemu${{ matrix.xlen }}-ref
      - name: CPU tests with random memory delays
        shell: bash -l {0}
        run: |
          set -o pipefail
          make cpu-tests-random-rv${{ matrix.xlen }} ARGS="-b -n -t 120" 2>&1 | tee /tmp/cpu-random.log
      - name: MicroBench with random memory delays
        shell: bash -l {0}
        run: |
          set -o pipefail
          make microbench-random-rv${{ matrix.xlen }} ARGS="-b -n -t 900" 2>&1 | tee /tmp/microbench-random.log
      - name: CoreMark with random memory delays
        shell: bash -l {0}
        run: |
          set -o pipefail
          # This is a CRC-checked functional stress run. The AM port uses
          # compile-time ITERATIONS (mainargs=test does not reduce its default 10).
          make coremark-random-rv${{ matrix.xlen }} ITERATIONS=1 ARGS="-b -n -t 900" 2>&1 | tee /tmp/coremark-random.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = re.sub(r'\x1b\[[0-9;]*m', '', Path('/tmp/coremark-random.log').read_text())
          expected = {'Iterations': '1', 'CoreMark Size': '666'}
          for label, value in expected.items():
              found = re.findall(r'^' + re.escape(label) + r'\s*:\s*(\S+)\s*$', log, re.M)
              if not found or any(item.lower() != value for item in found):
                  raise SystemExit(f'CoreMark smoke validation failed: {label}={found}, expected {value}')
          if re.findall(r'HIT (?:GOOD|BAD) TRAP', log) != ['HIT GOOD TRAP']:
              raise SystemExit('CoreMark did not terminate successfully')
          # AM klib does not format %04x correctly. Use CoreMark's internal
          # known-profile CRC comparisons and error summary, not printed hex.
          if '2K performance run parameters for coremark.' not in log:
              raise SystemExit('CoreMark did not select a known CRC validation profile')
          # A sub-10-second run is not a valid benchmark score; CRCs still apply.
          short = 'ERROR! Must execute for at least 10 secs for a valid result!'
          if any('ERROR!' in line and line.strip() != short for line in log.splitlines()):
              raise SystemExit('CoreMark reported an additional validation error')
          if short in log:
              if log.count(short) != 1 or log.count('Errors detected') != 1:
                  raise SystemExit('Incomplete CoreMark short-run validation summary')
          elif log.count('Correct operation validated.') != 1 or 'Errors detected' in log:
              raise SystemExit('CoreMark CRC validation failed')
          print('CoreMark random-memory CRC smoke PASS (1 iteration; not a benchmark score)')
          PY
      - name: Summarize stress configuration
        if: always()
        run: |
          {
            echo "## Sim random memory delays"
            echo "RV${{ matrix.xlen }}, preset=$RAPT_CONFIG, delay=0..$SIM_RANDOM_DELAY cycles/beat, seed=$SIM_RANDOM_SEED"
            echo "CoreMark: 1 iteration with CRC validation (functional smoke, not a benchmark score)."
          } >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/parse-pmu.sh \
            "CoreMark random" /tmp/coremark-random.log \
            "MicroBench random" /tmp/microbench-random.log \
            >> "$GITHUB_STEP_SUMMARY"
  app-pk-coremark:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Check CoreMark summary validation
        run: python3 .github/scripts/test_summarize_pk_coremark.py

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Clone riscv-pk
        run: |
          mkdir -p third_party/riscv-software-src
          [ -d third_party/riscv-software-src/riscv-pk ] || \
            git clone --depth 1 https://github.com/riscv-software-src/riscv-pk \
              third_party/riscv-software-src/riscv-pk

      - name: Build NEMU reference and simulator
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      - name: Build pk
        shell: bash -l {0}
        run: make --no-print-directory -C app pk-build

      # ---- Hello world ----
      - name: Run hello
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make app-hello-rv32 ARGS="-b -n" 2>&1 | tee /tmp/app-hello.log

      # CRC-checked smoke run; standard CoreMark validation still requires 10 seconds.
      - name: Run CoreMark
        shell: bash -l {0}
        run: |
          make app-coremark-rv32 ITERATIONS=1 ARGS="-b -n" 2>&1 | tee /tmp/app-coremark.log

      # ---- Summary ----
      - name: Generate summary
        if: always()
        run: |
          report_rc=0
          python3 .github/scripts/summarize-pk-coremark.py \
            /tmp/app-hello.log /tmp/app-coremark.log "$GITHUB_STEP_SUMMARY" \
            --expected-iterations 1 --allow-short || report_rc=$?
          bash .github/scripts/parse-pmu.sh \
            "Hello (pk)" /tmp/app-hello.log \
            "CoreMark (pk)" /tmp/app-coremark.log \
            >> "$GITHUB_STEP_SUMMARY" || true
          exit "$report_rc"

  app-baremetal-embench:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Build NEMU reference and simulator
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32

      # ---- Embench-IoT ----
      - name: Run Embench-IoT
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          make app-embench-baremetal-run-rv32 ARGS="-b -n"

      # ---- Summary ----
      - name: Generate summary
        if: always()
        run: |
          report_rc=0
          make app-embench-baremetal-report-rv32 || report_rc=$?
          cat sim/build/${{ env.RAPT_CONFIG }}/logs/app/embench-baremetal-rv32.md \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$report_rc"

  app-pk-embench:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-unknown-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Setup base environment
        run: |
          ./setup.sh
          ${CROSS_COMPILE}gcc --version | head -1

      - name: Clone riscv-pk
        run: |
          mkdir -p third_party/riscv-software-src
          [ -d third_party/riscv-software-src/riscv-pk ] || \
            git clone --depth 1 https://github.com/riscv-software-src/riscv-pk \
              third_party/riscv-software-src/riscv-pk

      - name: Build NEMU reference, simulator, and pk
        shell: bash -l {0}
        run: |
          make config-nemu32-ref
          make build-rv32
          make --no-print-directory -C app pk-build

      - name: Run pk/MMU Embench-IoT
        shell: bash -l {0}
        run: make app-embench-pk-run-rv32 ARGS="-b -n"

      - name: Generate pk/MMU summary
        if: always()
        run: |
          report_rc=0
          make app-embench-pk-report-rv32 || report_rc=$?
          cat sim/build/${{ env.RAPT_CONFIG }}/logs/app/embench-pk-rv32.md \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$report_rc"
