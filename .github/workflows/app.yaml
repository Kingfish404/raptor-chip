name: App (Verified, Linux boot, LiteX)

# Unified workflow RISCOF compatibility + coverage, Linux boot RV32/NEMU, and LiteX BIOS / CoreMark / Embench
#
# Jobs:
#   - riscof-classic: cross-validates the Raptor core against the upstream
#     riscv-non-isa/riscv-arch-test suite via the classic RISCOF flow
#     (sail-riscv reference).
#   - fuzztest-sigtest-and-coverage: builds with coverage instrumentation
#     and runs the verify suite to produce a unified Verilator coverage report.
#   - linux-rv32-test: checks RV32 Linux kernel entry on the Verilator model.
#   - release-rtl: packs every RTL preset; pushes publish the rtl-nightly release.
#   - nemu-linux-test: boots OpenSBI + Linux 32/64-bit on NEMU.
#   - litex-test: LiteX BIOS + CoreMark in the Verilator LiteX SoC.
# CI script self-tests live in ci-checks.yaml; summaries use ci_report.py.

on:
  schedule:
    - cron: "0 5 * * 0"
  push:
    branches: ["master", "main"]
    paths: &app-paths
      - "hdl/**"
      - "sim/**"
      - "nemu/**"
      - "linux/**"
      - "verify/**"
      - "fpga/litex/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "setup.sh"
      - "setup-rtl.sh"
      - ".github/workflows/app.yaml"
  pull_request:
    branches: ["master", "main"]
    paths: *app-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Login shell for the tool paths, keeping GitHub's errexit/pipefail.
    shell: bash -leo pipefail {0}

env:
  RAPT_CONFIG: default
  RAPTOR_HOME: ${{ github.workspace }}
  NEMU_HOME: ${{ github.workspace }}/nemu
  AM_HOME: ${{ github.workspace }}/abstract-machine
  CROSS_COMPILE: riscv64-elf-
  REPORT: python3 .github/scripts/ci_report.py

jobs:
  build-riscof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          profile: build
          build-cache: default-riscof-rv32
      - name: Build shared RISCOF simulator
        run: |
          make -C verify riscof-classic-build-npc
          # Follow the simulator symlink and retain executable modes. Capstone
          # is loaded from this workspace path at runtime.
          tar -czhf "$RUNNER_TEMP/riscof-npc.tar.gz" \
            "sim/build/$RAPT_CONFIG-riscof/riscv32-npc-sim" \
            nemu/tools/capstone/repo/libcapstone.so.5
      - name: Share simulator with compliance shards
        uses: actions/upload-artifact@v7
        with:
          name: riscof-npc-${{ github.sha }}
          path: ${{ runner.temp }}/riscof-npc.tar.gz
          retention-days: 1

  riscof-classic:
    needs: build-riscof
    runs-on: ubuntu-24.04
    # Allow the compliance step to time out before the job so its logs and
    # partial workdir can still be uploaded for diagnosis.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - name: Install Python 3.11
        # Pin Python to 3.11 to match the neorv32 RISC-V arch-test workflow
        # (the pinned RISCOF fork at d38859f has known issues on 3.12+).
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: riscof

      - name: Download shared RISCOF simulator
        uses: actions/download-artifact@v8
        with:
          name: riscof-npc-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Restore shared RISCOF simulator
        run: |
          tar -xzf "$RUNNER_TEMP/riscof-npc.tar.gz"
          test -x "sim/build/$RAPT_CONFIG-riscof/riscv32-npc-sim"
          test -s nemu/tools/capstone/repo/libcapstone.so.5

      - name: Install sail-riscv reference model
        run: |
          set -euo pipefail
          SAIL_VERSION=0.13.1
          SAIL_SHA256=ee052f64494a2f5f071afd9c2cb4aa5eaae4ba84753e4f77e442b4f83f2e9469
          SAIL_ARCHIVE="$RUNNER_TEMP/sail-riscv-Linux-x86_64.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/sail-riscv"
          curl --fail --location --retry 3 \
            --output "$SAIL_ARCHIVE" \
            "https://github.com/riscv/sail-riscv/releases/download/$SAIL_VERSION/sail-riscv-Linux-x86_64.tar.gz"
          echo "$SAIL_SHA256  $SAIL_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$SAIL_ARCHIVE" \
            -C "$GITHUB_WORKSPACE/sail-riscv" --strip-components=1
          ls -al "$GITHUB_WORKSPACE/sail-riscv/bin"
          echo "$GITHUB_WORKSPACE/sail-riscv/bin" >> "$GITHUB_PATH"

      - name: Install RISCOF (pinned fork)
        # Upstream RISCOF is broken on Python 3.12; use the maintained fork
        # commit also used by neorv32's compatibility workflow.
        # https://github.com/riscv-software-src/riscof/issues/122
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip3 install git+https://github.com/riscv/riscof.git@d38859f85fe407bcacddd2efcd355ada4683aee4

      - name: Cache riscv-arch-test suite
        uses: actions/cache@v5
        with:
          path: verify/riscof/classic/riscv-arch-test
          key:
            riscv-arch-test-main-${{ hashFiles('verify/riscof/classic/plugins/**',
            '.github/workflows/app.yaml') }}

      - name: “Sanity check | sail + toolchain”
        run: |
          set -e
          echo "=== python ==="
          python3 -V
          echo "=== sail_riscv_sim ==="
          command -v sail_riscv_sim
          test "$(sail_riscv_sim --version)" = "0.13.1"
          sail_riscv_sim --rv32 --validate-config
          sail_riscv_sim --validate-config
          echo "=== riscv64-elf-gcc ==="
          command -v riscv64-elf-gcc
          riscv64-elf-gcc --version | head -1
          echo "=== riscof ==="
          command -v riscof
          riscof --version || true

      - name: Run classic RISCOF compliance tests
        timeout-minutes: 180
        # Large D-extension cases exceed 45s even on local hardware.
        # Keep every test, distributing the suite across independent runners.
        # The simulator is built once for this workflow SHA. Skip only its
        # build prerequisite; each shard still runs its selected suite and
        # constructs its own inexpensive MROM image.
        run: >-
          make -C verify -o riscof-classic-build-npc riscof-classic-setup riscof-classic-run
          RISCOF_CLASSIC_TIMEOUT=600 JOBS=2
          RISCOF_CLASSIC_SHARD_INDEX=${{ matrix.shard }} RISCOF_CLASSIC_SHARD_COUNT=4

      - name: Diagnose missing reference signatures
        if: failure()
        run: |
          set +e
          WD=verify/build/riscof-classic
          echo "## Tests with missing Reference signatures"
          MISSING=0
          while IFS= read -r d; do
            if ! compgen -G "$d/Reference-*.signature" > /dev/null; then
              MISSING=$((MISSING+1))
              echo "---- MISSING: $d ----"
              ls "$d" 2>/dev/null
              for log in "$d"/*.log; do
                [ -f "$log" ] || continue
                echo "------ $log (tail) ------"
                tail -40 "$log"
              done
            fi
          done < <(find "$WD" -type d -name ref 2>/dev/null | sort)
          echo "Total tests missing ref signatures: $MISSING"
          exit 0

      - name: Upload RISCOF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riscof-classic-report-${{ matrix.shard }}
          path: |
            verify/build/riscof-classic/report.html
            verify/build/riscof-classic/style.css
          if-no-files-found: warn

      - name: Upload RISCOF workdir on failure (postmortem)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: riscof-classic-workdir-${{ matrix.shard }}-${{ github.sha }}
          path: |
            verify/build/riscof-classic/
            !verify/build/riscof-classic/**/*.elf
          if-no-files-found: warn
          retention-days: 7

  fuzztest-sigtest-and-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sim
          build-cache: default-coverage-rv32
      - name: Check parallel Kconfig builds
        run: python3 verify/scripts/test_kconfig_parallel.py
      - name: Build NEMU-Ref
        # All workloads below use the isolated coverage simulator.
        run: make build-nemu32-ref
      - name: Build with coverage instrumentation
        timeout-minutes: 90
        run: |
          set -euo pipefail
          /usr/bin/time -v make -C verify coverage-build 2>&1 | tee coverage-build.log

      - name: Upload coverage build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-build-log
          path: coverage-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run fuzz + sigtest for coverage
        run: |
          make -C verify coverage-run-fuzz TIMEOUT=10
          make -C verify coverage-run-sigtest TIMEOUT=10

      - name: Run coremark + isa-tests-pk for coverage
        run: |
          make -C verify coverage-run-coremark
          make -C verify coverage-run-isa-tests-pk

      - name: Generate coverage report
        run: make -C verify coverage-report COV_LINE_MIN=50.0

  linux-rv32-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sim
          build-cache: default-linux-rv32
      - name: Download pre-built Linux kernel
        run: make linux-download-rv32
      - name: Check RV32 Linux kernel entry with default difftest
        # NPC's legacy -m/MAX_INST budget counts cycles. Stop at the checked
        # entry marker instead of spending the remaining budget after success.
        run: |
          make linux-boot-rv32 ARGS="-b -n --serial-exit-on='Linux version'" MAX_INST=10000000 \
            2>&1 | tee /tmp/linux-boot.log || true
      - name: Linux kernel-entry summary
        run: |
          {
            $REPORT boot "Linux Kernel Entry Test (RV32)" /tmp/linux-boot.log \
              "Kernel entry (Linux version)=Linux version" || true
            $REPORT pmu "Linux Boot RV32" /tmp/linux-boot.log
          } >> "$GITHUB_STEP_SUMMARY"
          python3 verify/scripts/check_linux_boot.py \
            --success-marker "Linux version" /tmp/linux-boot.log

  release-rtl:
    # Gate release on the default Linux kernel-entry check.
    needs: linux-rv32-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup build environment
        uses: ./.github/actions/setup-environment
        with:
          profile: build
      - name: Pack RTL for every config
        run: |
          for config_header in hdl/configs/*/rapt_config.svh; do
            config=${config_header%/rapt_config.svh}
            config=${config##*/}
            make pack RAPT_CONFIG="$config"
          done
      - name: Collect release artifacts
        run: |
          mkdir -p dist/hdl
          for config_header in hdl/configs/*/rapt_config.svh; do
            config=${config_header%/rapt_config.svh}
            config=${config##*/}
            cp "sim/build/$config/rapt_pack.sv" "dist/rapt_pack-$config.sv"
            cp "sim/build/$config/rapt_pack.svh" "dist/rapt_pack-$config.svh"
            printf '%s\n' "$config" >> dist/CONFIGS
          done
          cp dist/rapt_pack-default.sv dist/rapt_pack.sv
          cp dist/rapt_pack-default.svh dist/rapt_pack.svh
          cp -r hdl/. dist/hdl/
          printf "commit: %s\nref: %s\ndate: %s\n" \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/VERSION
          (cd dist && zip -r ../raptor-chip-rtl.zip .)
      - name: Upload RTL artifact
        uses: actions/upload-artifact@v7
        with:
          name: raptor-chip-rtl-${{ github.sha }}
          path: dist/
          retention-days: 90
          overwrite: true
      - name: Publish nightly RTL release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rtl-nightly --yes --cleanup-tag 2>/dev/null || true
          assets=(
            "dist/rapt_pack.sv#rapt_pack.sv (default packed RTL)"
            "dist/rapt_pack.svh#rapt_pack.svh (default macro definitions)"
            "raptor-chip-rtl.zip#raptor-chip-rtl.zip (full RTL source and all configs)"
          )
          for config_header in hdl/configs/*/rapt_config.svh; do
            config=${config_header%/rapt_config.svh}
            config=${config##*/}
            assets+=(
              "dist/rapt_pack-$config.sv#rapt_pack-$config.sv ($config packed RTL)"
              "dist/rapt_pack-$config.svh#rapt_pack-$config.svh ($config macro definitions)"
            )
          done
          gh release create rtl-nightly \
            --title "RTL Nightly ($GITHUB_REF_NAME, $(date -u +%Y-%m-%d))" \
            --notes "Auto-generated RTL release from commit \`$GITHUB_SHA\`." \
            --prerelease \
            "${assets[@]}"

  nemu-linux-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: nemu
      - name: Build OpenSBI
        run: |
          make -C third_party/riscv-software-src/opensbi PLATFORM=generic PLATFORM_RISCV_XLEN=32 \
            PLATFORM_RISCV_ISA=rv32imac_zicntr_zicond_zicsr_zifencei_zba_zbb_zbs \
            CROSS_COMPILE=riscv64-linux-gnu- -j"$(nproc)"
      - name: Build NEMU (Linux config)
        run: make build-nemu32-linux
      - name: Test OpenSBI on NEMU
        run: |
          make -C nemu run IMG=../third_party/riscv-software-src/opensbi/build/platform/generic/firmware/fw_payload.bin \
            ARGS="-b -m 10000000 --log ./build/nemu-log.txt" 2>&1 | tee /tmp/nemu-opensbi.log
      - name: Download pre-built Linux kernel
        run: make linux-download-rv32 linux-download-rv64
      - name: Boot Linux 32-bit on NEMU
        run: make linux-boot-nemu32 ARGS="-b" MAX_INST=1400000000
      - name: Boot Linux 64-bit on NEMU
        run: make linux-boot-nemu64 ARGS="-b" MAX_INST=1400000000
      # NEMU prints the guest console to stderr, which the Makefile tees into
      # nemu/build/logs/. The --log file only holds NEMU's internal trace.
      # Informational: the boot steps above already fail on a NEMU error.
      - name: NEMU Linux boot summary
        if: always()
        run: |
          for xlen in 32 64; do
            $REPORT boot "Linux Boot Test (NEMU RV$xlen)" "nemu/build/logs/linux-boot-nemu$xlen.log" \
              "Kernel boot=Linux version" "Reaches init=Run /init as init process" || true
          done >> "$GITHUB_STEP_SUMMARY"

  litex-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SIM_JOBS: "2"
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: litex
          build-cache: default-litex
      - name: Prepare LiteX
        run: cd fpga/litex && make setup
      - name: Build LiteX BIOS simulation
        run: cd fpga/litex && make sim-build ROM=bios
      - name: Run LiteX BIOS
        # The BIOS waits for console input. Limit runtime, not the cold build.
        run: cd fpga/litex && make sim-run ROM=bios SIM_TIMEOUT=240
      - name: CoreMark on LiteX
        run: |
          cd fpga/litex
          # Two iterations make this a functional smoke test, not a score-valid run.
          # The inner timeout applies after the separate CoreMark Vsim cold build.
          COREMARK_RC=0
          make coremark COREMARK_ITERATIONS=2 SIM_TIMEOUT=300 \
            2>&1 | tee /tmp/litex-coremark.log || COREMARK_RC=$?
          if [ "$COREMARK_RC" -ne 0 ]; then
            echo "::warning::LiteX CoreMark build or simulation exited with $COREMARK_RC; retaining the log and continuing"
            tail -n 100 /tmp/litex-coremark.log || true
          elif ! grep -q 'CoreMark: done\.' /tmp/litex-coremark.log; then
            echo "::warning::LiteX CoreMark did not reach its completion marker before its timeout; retaining the log and continuing"
            tail -n 100 /tmp/litex-coremark.log || true
          elif ! grep -q 'Correct operation validated' /tmp/litex-coremark.log; then
            echo "::notice::LiteX CoreMark completed its two-iteration smoke test; score validation is intentionally skipped"
          fi
      - name: LiteX summary
        if: always()
        run: $REPORT litex-coremark /tmp/litex-coremark.log >> "$GITHUB_STEP_SUMMARY"
