name: App (Verified, Linux boot, LiteX)

# Unified workflow RISCOF compatibility + coverage, Linux boot NPC/NEMU, and LiteX BIOS / CoreMark / Embench
#
# Jobs:
#   - riscof-classic: cross-validates the Raptor core against the upstream
#     riscv-non-isa/riscv-arch-test suite via the classic RISCOF flow
#     (sail-riscv reference).
#   - fuzztest-sigtest-and-coverage: builds NPC with coverage instrumentation
#     and runs the verify suite to produce a unified Verilator coverage report.
#   - linux-npc-test: boots Linux on the Verilator NPC and publishes the RTL
#     nightly release.
#   - nemu-linux-test: boots OpenSBI + Linux 32/64-bit on NEMU.
#   - litex-test: LiteX BIOS + CoreMark in the Verilator LiteX SoC.
#   - litex-embench: Embench-IoT in the Verilator LiteX SoC.

on:
  schedule:
    - cron: "0 5 * * 0"
  push:
    branches: ["master", "main"]
    paths:
      - "rtl_sv/**"
      - "rtl_scala/**"
      - "nsim/**"
      - "nemu/**"
      - "linux/**"
      - "verify/**"
      - "fpga/litex/**"
      - ".github/scripts/**"
      - ".github/workflows/app.yaml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "rtl_sv/**"
      - "rtl_scala/**"
      - "nsim/**"
      - "nemu/**"
      - "linux/**"
      - "verify/**"
      - "fpga/litex/**"
      - ".github/scripts/**"
      - ".github/workflows/app.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  riscof-classic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6

      - name: Install Python 3.11
        # Pin Python to 3.11 to match the neorv32 RISC-V arch-test workflow
        # (the pinned RISCOF fork at d38859f has known issues on 3.12+).
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup environment
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Install sail-riscv reference model
        run: |
          set -euo pipefail
          # Tarball contains a top-level sail-riscv-Linux-x86_64/ directory
          # with bin/, include/, share/. Strip it so binary lands directly in
          # $GITHUB_WORKSPACE/sail-riscv/bin/sail_riscv_sim.
          mkdir -p "$GITHUB_WORKSPACE/sail-riscv"
          curl -L https://github.com/riscv/sail-riscv/releases/download/0.11/sail-riscv-Linux-x86_64.tar.gz \
            | tar -xz -C "$GITHUB_WORKSPACE/sail-riscv" --strip-components=1
          ls -al "$GITHUB_WORKSPACE/sail-riscv/bin"
          echo "$GITHUB_WORKSPACE/sail-riscv/bin" >> "$GITHUB_PATH"

      - name: Install RISCOF (pinned fork)
        # Upstream RISCOF is broken on Python 3.12; use the maintained fork
        # commit also used by neorv32's compatibility workflow.
        # https://github.com/riscv-software-src/riscof/issues/122
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip3 install git+https://github.com/riscv/riscof.git@d38859f85fe407bcacddd2efcd355ada4683aee4

      - name: Build NPC (no difftest) and MROM image
        shell: bash -l {0}
        run: |
          make config-npc32
          make -C nsim -j$(nproc)
          make -C nsim/csrc/mem/mrom-data

      - name: Cache riscv-arch-test suite
        uses: actions/cache@v5
        with:
          path: verify/riscof/classic/riscv-arch-test
          key:
            riscv-arch-test-main-${{ hashFiles('verify/riscof/classic/plugins/**',
            '.github/workflows/app.yaml') }}

      - name: “Sanity check | sail + toolchain”
        shell: bash -l {0}
        run: |
          set -e
          echo "=== python ==="
          python3 -V
          echo "=== sail_riscv_sim ==="
          command -v sail_riscv_sim
          sail_riscv_sim --version || true
          echo "=== riscv64-elf-gcc ==="
          command -v riscv64-elf-gcc
          riscv64-elf-gcc --version | head -1
          echo "=== riscof ==="
          command -v riscof
          riscof --version || true

      - name: Run classic RISCOF compliance tests
        shell: bash -l {0}
        run: make -C verify riscof-classic TIMEOUT=45

      - name: Diagnose missing reference signatures
        if: failure()
        shell: bash -l {0}
        run: |
          set +e
          WD=verify/build/riscof-classic
          echo "## Tests with missing Reference signatures"
          MISSING=0
          while IFS= read -r d; do
            sig=$(ls "$d"/Reference-*.signature 2>/dev/null | head -1)
            if [ -z "$sig" ]; then
              MISSING=$((MISSING+1))
              echo "---- MISSING: $d ----"
              ls "$d" 2>/dev/null
              for log in "$d"/*.log; do
                [ -f "$log" ] || continue
                echo "------ $log (tail) ------"
                tail -40 "$log"
              done
            fi
          done < <(find "$WD" -type d -name ref 2>/dev/null | sort)
          echo "Total tests missing ref signatures: $MISSING"

      - name: Upload RISCOF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riscof-classic-report
          path: |
            verify/build/riscof-classic/report.html
            verify/build/riscof-classic/style.css
          if-no-files-found: warn

      - name: Upload RISCOF workdir on failure (postmortem)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: riscof-classic-workdir-${{ github.sha }}
          path: |
            verify/build/riscof-classic/
            !verify/build/riscof-classic/**/*.elf
          if-no-files-found: warn
          retention-days: 14

  fuzztest-sigtest-and-coverage:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build NPC with difftest and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-npc32-difftest
          make config-nemu32-ref
      # - name: Random instruction fuzz tests
      #   shell: bash -l {0}
      #   run: make -C verify fuzz SEED=42 FUZZ_NUM=20 FUZZ_LEN=200 TIMEOUT=10
      # - name: Signature-based ISA tests
      #   shell: bash -l {0}
      #   run: make -C verify sigtest TIMEOUT=10
      - name: Build NPC with coverage instrumentation
        shell: bash -l {0}
        run: make -C verify coverage-build

      - name: Run fuzz + sigtest for coverage
        shell: bash -l {0}
        run: |
          make -C verify coverage-run-fuzz TIMEOUT=10
          make -C verify coverage-run-sigtest TIMEOUT=10

      - name: Run coremark + isa-tests-pk for coverage
        shell: bash -l {0}
        run: |
          make -C verify coverage-run-coremark
          make -C verify coverage-run-isa-tests-pk

      - name: Generate coverage report
        shell: bash -l {0}
        run: make -C verify coverage-report

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: verify/build/coverage/
          retention-days: 30

  linux-npc-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Download pre-built Linux kernel
        shell: bash -l {0}
        run: make linux-download-rv32
      - name: Boot Linux on NPC with difftest
        shell: bash -l {0}
        run: |
          make linux-boot-npc32-difftest ARGS="-b -n" MAX_INST=120000000 \
            2>&1 | tee /tmp/linux-boot.log || true
      - name: Linux boot summary
        run: |
          BOOT_OK="no"
          grep -q "Booting Linux on hartid" /tmp/linux-boot.log && BOOT_OK="yes"
          INIT_OK="no"
          grep -q "Run /init as init process" /tmp/linux-boot.log && INIT_OK="yes"
          IPC=$(grep -oP 'IPC:\s*\K[0-9.]+' /tmp/linux-boot.log | head -1 || echo "N/A")
          INSTS=$(grep -oP '#inst:\s*\K\d+' /tmp/linux-boot.log | head -1 || echo "N/A")
          CYCLES=$(grep -oP 'cycle:\s*\K\d+' /tmp/linux-boot.log | head -1 || echo "N/A")
          {
            echo ""
            echo "## Linux Boot Test (NPC)"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Kernel boot | $([ "$BOOT_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
            echo "| Reaches init | $([ "$INIT_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| IPC | $IPC |"
            echo "| Instructions | $INSTS |"
            echo "| Cycles | $CYCLES |"
          } >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/parse-pmu.sh \
            "Linux Boot NPC" /tmp/linux-boot.log \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Pack RTL into single file
        shell: bash -l {0}
        run: make pack
      - name: Collect release artifacts
        run: |
          mkdir -p dist/rtl_sv
          cp nsim/build/default/rapt_pack.sv dist/
          cp nsim/build/default/rapt_pack.svh dist/
          cp -r rtl_sv/. dist/rtl_sv/
          printf "commit: %s\nref: %s\ndate: %s\n" \
            "${{ github.sha }}" "${{ github.ref_name }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/VERSION
          cd dist && zip -r ../raptor-chip-rtl.zip .
      - name: Upload RTL artifact
        uses: actions/upload-artifact@v7
        with:
          name: raptor-chip-rtl-${{ github.sha }}
          path: dist/
          retention-days: 90
          overwrite: true
      - name: Delete existing nightly release
        if: github.event_name == 'push'
        run: gh release delete rtl-nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create nightly RTL release
        if: github.event_name == 'push'
        run: |
          gh release create rtl-nightly \
            --title "RTL Nightly (${{ github.ref_name }}, $(date -u +%Y-%m-%d))" \
            --notes "Auto-generated RTL release from commit \`${{ github.sha }}\`." \
            --prerelease \
            "nsim/build/default/rapt_pack.sv#rapt_pack.sv (single-file packed RTL)" \
            "nsim/build/default/rapt_pack.svh#rapt_pack.svh (macro definitions)" \
            "raptor-chip-rtl.zip#raptor-chip-rtl.zip (full RTL source)"
        env:
          GH_TOKEN: ${{ github.token }}

  nemu-linux-test:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Build OpenSBI
        run: make -C third_party/riscv-software-src/opensbi PLATFORM_RISCV_ISA=rv32imac_zicntr_zicond_zicsr_zifencei_zba_zbb_zbs CROSS_COMPILE=riscv64-linux-gnu- PLATFORM_RISCV_XLEN=32 PLATFORM=generic -j$(nproc)
      - name: Build NEMU (Linux config)
        shell: bash -l {0}
        run: make config-nemu32-linux
      - name: Test OpenSBI on NEMU
        shell: bash -l {0}
        run: make -C nemu run IMG=../third_party/riscv-software-src/opensbi/build/platform/generic/firmware/fw_payload.bin ARGS="-b -m 10000000 --log ./build/nemu-log.txt"
      - name: Download pre-built Linux kernel
        shell: bash -l {0}
        run: make linux-download-rv32 linux-download-rv64
      - name: Boot Linux 32-bit on NEMU
        shell: bash -l {0}
        run: make linux-boot-nemu32 ARGS="-b" MAX_INST=1400000000
      - name: Boot Linux 64-bit on NEMU
        shell: bash -l {0}
        run: make linux-boot-nemu64 ARGS="-b" MAX_INST=1400000000
      - name: NEMU Linux boot summary
        if: always()
        run: |
          # NEMU prints the guest serial console (Linux banner, init message) to
          # stderr, which the Makefile's tee_nemu macro captures into per-target
          # logs under nemu/build/logs/. The --log file only holds NEMU's
          # internal trace, so grep those tee logs instead.
          LOG32="./nemu/build/logs/linux-boot-nemu32.log"
          LOG64="./nemu/build/logs/linux-boot-nemu64.log"
          BOOT32_OK="no"
          [ -f "$LOG32" ] && grep -q "Linux version" "$LOG32" && BOOT32_OK="yes"
          INIT32_OK="no"
          [ -f "$LOG32" ] && grep -q "Run /init as init process" "$LOG32" && INIT32_OK="yes"
          BOOT64_OK="no"
          [ -f "$LOG64" ] && grep -q "Linux version" "$LOG64" && BOOT64_OK="yes"
          INIT64_OK="no"
          [ -f "$LOG64" ] && grep -q "Run /init as init process" "$LOG64" && INIT64_OK="yes"
          {
            echo ""
            echo "## Linux Boot Test (NEMU)"
            echo "| Check | 32-bit Status | 64-bit Status |"
            echo "|-------|---------------|---------------|"
            echo "| Kernel boot | $([ "$BOOT32_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') | $([ "$BOOT64_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
            echo "| Reaches init | $([ "$INIT32_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') | $([ "$INIT64_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  litex-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAPTOR_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Prepare LiteX
        shell: bash -l {0}
        run: cd fpga/litex && make setup
      - name: Run LiteX BIOS
        shell: bash -l {0}
        run: cd fpga/litex && timeout 240s make bios SIM_TIMEOUT=0 || true
      - name: CoreMark on LiteX
        shell: bash -l {0}
        run: |
          cd fpga/litex
          # Two iterations make this a functional smoke test, not a score-valid run.
          # The inner timeout applies after the separate CoreMark Vsim cold build.
          set -o pipefail
          COREMARK_RC=0
          make coremark COREMARK_ITERATIONS=2 SIM_TIMEOUT=300 \
            2>&1 | tee /tmp/litex-coremark.log || COREMARK_RC=$?
          if [ "$COREMARK_RC" -ne 0 ]; then
            echo "::warning::LiteX CoreMark build or simulation exited with $COREMARK_RC; retaining the log and continuing"
            tail -n 100 /tmp/litex-coremark.log || true
          elif ! grep -q 'CoreMark: done\.' /tmp/litex-coremark.log; then
            echo "::warning::LiteX CoreMark did not reach its completion marker before its timeout; retaining the log and continuing"
            tail -n 100 /tmp/litex-coremark.log || true
          elif ! grep -q 'Correct operation validated' /tmp/litex-coremark.log; then
            echo "::notice::LiteX CoreMark completed its two-iteration smoke test; score validation is intentionally skipped"
          fi
      - name: LiteX summary
        if: always()
        run: |
          LOG=/tmp/litex-coremark.log
          CM_SCORE=$(grep -oP 'Iterations/Sec\s*:\s*\K[0-9.]+' "$LOG" 2>/dev/null | head -1 || echo "N/A")
          CM_ITERS=$(grep -oP 'Iterations\s*:\s*\K[0-9]+' "$LOG" 2>/dev/null | head -1 || echo "N/A")
          CM_TICKS=$(grep -oP 'Total ticks\s*:\s*\K[0-9]+' "$LOG" 2>/dev/null | head -1 || echo "N/A")
          CM_TIME=$(grep -oP 'Total time \(secs\):\s*\K[0-9.]+' "$LOG" 2>/dev/null | head -1 || echo "N/A")
          CPU_INFO=$(grep -oP 'CPU:\s*\K.+' "$LOG" 2>/dev/null | head -1 || echo "N/A")
          if grep -q 'Correct operation validated' "$LOG" 2>/dev/null; then
            CM_VALID="PASS"
          elif [ "$CM_ITERS" = "2" ]; then
            CM_VALID="SMOKE (score validation skipped)"
          else
            CM_VALID="FAIL"
          fi
          {
            echo ""
            echo "## LiteX CoreMark Results"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| CPU | $CPU_INFO |"
            echo "| CoreMark Score (Iter/s) | $CM_SCORE |"
            echo "| Iterations | $CM_ITERS |"
            echo "| Total Ticks | $CM_TICKS |"
            echo "| Total Time (s) | $CM_TIME |"
            echo "| Validation | $CM_VALID |"
          } >> "$GITHUB_STEP_SUMMARY"

  litex-embench:
    runs-on: ubuntu-latest
    env:
      RAPTOR_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        run: ./setup.sh
      - name: Prepare LiteX
        shell: bash -l {0}
        run: cd fpga/litex && make setup

      - name: Run Embench-IoT
        shell: bash -l {0}
        run: |
          cd fpga/litex
          # Two single-threaded simulations avoid oversubscribing the hosted
          # runner while retaining parallel benchmark throughput.
          set -o pipefail
          make embench SIM_TIMEOUT=1800 SIM_THREADS=1 EMBENCH_JOBS=2 \
            2>&1 | tee /tmp/litex-embench.log

      - name: Generate Embench summary
        if: always()
        run: |
          LOG_DIR="nsim/build/default/logs/litex/embench-logs"
          SUMMARY="$LOG_DIR/summary.md"
          REF_JSON=".github/data/embench-m4-ref.json"

          # report-embench.sh already ran and wrote summary.md — use it
          # as the base. If missing (e.g. build failed), generate a minimal one.
          if [ ! -f "$SUMMARY" ]; then
            echo "## LiteX Embench-IoT Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Embench run did not produce results._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- Extract aggregate Score from summary.md ----
          EMBENCH_SCORE=$(grep -oP '\*\*Embench Score\*\*.*\|\s*\*\*\K[0-9.]+' "$SUMMARY" | head -1 || echo "N/A")

          # ---- Count pass/fail from per-bench logs ----
          PASS=0; FAIL=0; TOTAL=0
          for log in "$LOG_DIR"/*.log; do
            [ -f "$log" ] || continue
            name=$(basename "$log" .log)
            [ "$name" = "summary" ] && continue
            TOTAL=$((TOTAL+1))
            if grep -q '^Result: PASS' "$log" 2>/dev/null; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
            fi
          done

          {
            echo ""
            echo "## LiteX Embench-IoT Results"
            echo ""
            echo "**${PASS}/${TOTAL} pass** — Embench Score: **${EMBENCH_SCORE}** (vs Cortex-M4 @ 16 MHz)"
            echo ""
            # Per-benchmark table
            echo "| Benchmark | Status | Cycles | Speed (vs M4) |"
            echo "|-----------|--------|-------:|--------------:|"
            for log in "$LOG_DIR"/*.log; do
              [ -f "$log" ] || continue
              name=$(basename "$log" .log)
              [ "$name" = "summary" ] && continue
              cycles=$(grep -m1 -oP '^Cycles:\s*\K\d+' "$log" || echo "")
              status=$(grep -m1 -oP '^Result:\s*\K\S+' "$log" || echo "?")
              ref_ms=$(grep -oE "\"${name}\"[[:space:]]*:[[:space:]]*[0-9.]+" "$REF_JSON" 2>/dev/null \
                | grep -oE '[0-9.]+$' | head -1 || echo "")
              speed="N/A"
              if [ -n "$ref_ms" ] && [ -n "$cycles" ] && [ "$cycles" -gt 0 ]; then
                speed=$(awk -v r="$ref_ms" -v c="$cycles" 'BEGIN{printf "%.3f", r*1000.0/c}')
              fi
              echo "| $name | $status | ${cycles:-N/A} | $speed |"
            done
            echo ""
            echo "| Metric | Value |"
            echo "|--------|------:|"
            echo "| **Embench Score** (geomean speed vs M4@16MHz) | **${EMBENCH_SCORE}** |"
            echo "| Passing benchmarks | ${PASS}/${TOTAL} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: litex-embench-logs-${{ github.sha }}
          path: |
            nsim/build/default/logs/litex/embench-logs/
            /tmp/litex-embench.log
          retention-days: 30
          overwrite: true
