name: build & eval

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  ppa-npc-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag sta:latest --build-arg CACHEBUST=$(date +%s)

      - name: Run microbench riscv32-npc
        run: |
          mkdir -p .github/results
          docker run --rm sta:latest bash -c \
            "make microbench-npc32 ARGS='-b -n' MAINARGS=test" \
            2>&1 | tee /tmp/microbench-npc.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-npc.log > .github/results/microbench-npc.txt

      - name: Run microbench riscv32e-npc
        run: |
          docker run --rm sta:latest bash -c \
            "make microbench-npc32 NPC_ARCH=riscv32e-npc ARGS='-b -n' MAINARGS=test" \
            2>&1 | tee /tmp/microbench-npce.log
          bash .github/scripts/parse-benchmark.sh microbench /tmp/microbench-npce.log > .github/results/microbench-npce.txt

      - name: Run coremark riscv32-npc
        run: |
          docker run --rm sta:latest bash -c \
            "make coremark-npc32 ARGS='-b -n'" \
            2>&1 | tee /tmp/coremark-npc.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-npc.log > .github/results/coremark-npc.txt

      - name: Run coremark riscv32e-npc
        run: |
          docker run --rm sta:latest bash -c \
            "make coremark-npc32 NPC_ARCH=riscv32e-npc ARGS='-b -n'" \
            2>&1 | tee /tmp/coremark-npce.log
          bash .github/scripts/parse-benchmark.sh coremark /tmp/coremark-npce.log > .github/results/coremark-npce.txt

      - name: Run RISC-V Architecture Test riscv32-npc
        run: |
          docker run --rm sta:latest bash -c \
            "make build-npc32 && make -C /workspaces/raptor-chip/riscv-arch-test-am ARCH=riscv32-npc run ARGS='-b -n'" \
            2>&1 | tee /tmp/archtest-npc.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-npc.log > .github/results/archtest-npc.txt

      - name: Run RISC-V Architecture Test riscv32e-npc
        run: |
          docker run --rm sta:latest bash -c \
            "make build-npc32 && make -C /workspaces/raptor-chip/riscv-arch-test-am ARCH=riscv32e-npc run ARGS='-b -n'" \
            2>&1 | tee /tmp/archtest-npce.log
          bash .github/scripts/parse-benchmark.sh archtest /tmp/archtest-npce.log > .github/results/archtest-npce.txt

      - name: Run STA (Power, Frequency, Area)
        run: |
          docker run --rm sta:latest bash -c "make sta 2>&1" | tee /tmp/sta.log | tail -256
          bash .github/scripts/parse-benchmark.sh sta /tmp/sta.log > .github/results/sta.txt

      - name: Generate benchmark summary
        run: bash .github/scripts/generate-summary.sh .github/results .github/benchmark-results.json "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            .github/benchmark-results.json
            .github/results/
          retention-days: 90
          overwrite: true

      - name: Clean up
        run: docker rmi sta:latest

  linux-npc-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YSYX_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        run: ./setup.sh
      - name: Download pre-built Linux kernel
        shell: bash -l {0}
        run: make linux-download-rv32
      - name: Boot Linux on NPC
        shell: bash -l {0}
        run: timeout 3600s make linux-boot-npc32 ARGS="-b -n" 2>&1 | tee /tmp/linux-boot.log || true
      - name: Linux boot summary
        run: |
          BOOT_OK="no"
          grep -q "Booting Linux on hartid" /tmp/linux-boot.log && BOOT_OK="yes"
          INIT_OK="no"
          grep -q "Run /init as init process" /tmp/linux-boot.log && INIT_OK="yes"
          {
            echo ""
            echo "## Linux Boot Test (NPC)"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Kernel boot | $([ "$BOOT_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
            echo "| Reaches init | $([ "$INIT_OK" = "yes" ] && echo 'PASS' || echo 'FAIL') |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pack RTL into single file
        shell: bash -l {0}
        run: make pack
      - name: Collect release artifacts
        run: |
          mkdir -p dist/rtl_sv
          cp nsim/build/ysyx_pack.sv dist/
          cp nsim/build/ysyx_pack.svh dist/
          cp -r rtl_sv/. dist/rtl_sv/
          printf "commit: %s\nref: %s\ndate: %s\n" \
            "${{ github.sha }}" "${{ github.ref_name }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/VERSION
          cd dist && zip -r ../raptor-chip-rtl.zip .
      - name: Upload RTL artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-chip-rtl-${{ github.sha }}
          path: dist/
          retention-days: 90
          overwrite: true
      - name: Delete existing nightly release
        if: github.event_name == 'push'
        run: gh release delete rtl-nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create nightly RTL release
        if: github.event_name == 'push'
        run: |
          gh release create rtl-nightly \
            --title "RTL Nightly (${{ github.ref_name }}, $(date -u +%Y-%m-%d))" \
            --notes "Auto-generated RTL release from commit \`${{ github.sha }}\`." \
            --prerelease \
            "nsim/build/ysyx_pack.sv#ysyx_pack.sv (single-file packed RTL)" \
            "nsim/build/ysyx_pack.svh#ysyx_pack.svh (macro definitions)" \
            "raptor-chip-rtl.zip#raptor-chip-rtl.zip (full RTL source)"
        env:
          GH_TOKEN: ${{ github.token }}

  ysyxsoc-test:
    runs-on: ubuntu-latest
    env:
      YSYX_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        run: ./setup.sh
      - name: Generate ysyxSoC
        shell: bash -l {0}
        run: make -C ./third_party/kingfish404/ysyxSoC/ dev-init verilog
      - name: Build NPC (ysyxSoC config) and NEMU-Ref
        shell: bash -l {0}
        run: |
          make config-npc32-ysyxsoc
          make config-nemu32-ref
      - name: Run microbench riscv32-ysyxsoc
        shell: bash -l {0}
        run: make microbench-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/mb-soc.log
      - name: Run microbench riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make -C $YSYX_HOME/am-kernels/benchmarks/microbench ARCH=riscv32e-ysyxsoc run mainargs="test" ARGS="-b -n" 2>&1 | tee /tmp/mb-soce.log
      - name: Run coremark riscv32-ysyxsoc
        shell: bash -l {0}
        run: make coremark-ysyxsoc ARGS="-b -n" 2>&1 | tee /tmp/cm-soc.log
      - name: Run coremark riscv32e-ysyxsoc
        shell: bash -l {0}
        run: |
          make -C $YSYX_HOME/am-kernels/benchmarks/coremark_eembc ARCH=riscv32e-ysyxsoc run ARGS="-b -n" 2>&1 | tee /tmp/cm-soce.log
      - name: ysyxSoC benchmark summary
        shell: bash -l {0}
        run: |
          extract_ipc() { grep -oP 'IPC:\s*\K[0-9.]+' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_score() { grep -oP '\d+(?=(/1000)? Marks)' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          extract_trap() { grep -oE 'HIT (GOOD|BAD) TRAP' "$1" 2>/dev/null | head -1 || echo "N/A"; }
          {
            echo ""
            echo "## ysyxSoC Benchmark Results"
            echo "| Benchmark | Target | Score | IPC | Status |"
            echo "|-----------|--------|-------|-----|--------|"
            echo "| CoreMark  | riscv32-ysyxsoc  | $(extract_score /tmp/cm-soc.log) | $(extract_ipc /tmp/cm-soc.log) | $(extract_trap /tmp/cm-soc.log) |"
            echo "| CoreMark  | riscv32e-ysyxsoc | $(extract_score /tmp/cm-soce.log) | $(extract_ipc /tmp/cm-soce.log) | $(extract_trap /tmp/cm-soce.log) |"
            echo "| MicroBench | riscv32-ysyxsoc  | $(extract_score /tmp/mb-soc.log) | $(extract_ipc /tmp/mb-soc.log) | $(extract_trap /tmp/mb-soc.log) |"
            echo "| MicroBench | riscv32e-ysyxsoc | $(extract_score /tmp/mb-soce.log) | $(extract_ipc /tmp/mb-soce.log) | $(extract_trap /tmp/mb-soce.log) |"
          } >> "$GITHUB_STEP_SUMMARY"

  litex-test:
    runs-on: ubuntu-latest
    env:
      YSYX_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        shell: bash -l {0}
        run: ./setup.sh
      - name: Prepare LiteX
        shell: bash -l {0}
        run: cd fpga/litex && ./setup.sh
      - name: Run LiteX
        shell: bash -l {0}
        run: cd fpga/litex && source ./venv/bin/activate && timeout 180s make run_ni || true
      - name: CoreMark on LiteX
        shell: bash -l {0}
        run: cd fpga/litex && source ./venv/bin/activate && pushd $YSYX_HOME/third_party/enjoy-digital/litex && litex_bare_metal_demo --build-path=build/sim/ && popd && timeout 300s make coremark || true

  nemu-test:
    runs-on: ubuntu-latest
    env:
      YSYX_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        run: ./setup.sh
      - name: Build OpenSBI
        run: make -C third_party/riscv-software-src/opensbi PLATFORM_RISCV_ISA=rv32imac_zicntr_zicsr_zifencei CROSS_COMPILE=riscv64-linux-gnu- PLATFORM_RISCV_XLEN=32 PLATFORM=generic -j$(nproc)
      - name: Build NEMU (Linux config)
        shell: bash -l {0}
        run: make config-nemu32-linux
      - name: Test OpenSBI on NEMU
        shell: bash -l {0}
        run: timeout 1440s make -C nemu run IMG=../third_party/riscv-software-src/opensbi/build/platform/generic/firmware/fw_payload.bin ARGS="-b -m 10000000 --log ./build/nemu-log.txt"
      - name: Download pre-built Linux kernel
        shell: bash -l {0}
        run: make linux-download-rv32
      - name: Boot Linux on NEMU
        shell: bash -l {0}
        run: timeout 1800s make linux-boot-nemu32 ARGS="-b -m 80000000 --log ./nemu/build/nemu-log.txt"
