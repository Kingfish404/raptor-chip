name: STA (PPA matrix)

# Static Timing Analysis across {rv32, rv64} × {nangate45, asap7, sky130hd}.
# Runs on RTL/simulator changes, weekly to refresh tool and PDK revisions, and
# on manual dispatch. Logs are uploaded; ci_report.py renders the summary.

on:
  push:
    branches: ["master", "main"]
    paths: &sta-paths
      - "rtl/**"
      - "tools/decodegen/**"
      - "sim/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "setup.sh"
      - "setup-rtl.sh"
      - ".github/workflows/sta.yaml"
  pull_request:
    branches: ["master", "main"]
    paths: *sta-paths
  schedule:
    - cron: "0 20 * * 0" # Sundays 20:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -leo pipefail {0}

env:
  RAPT_CONFIG: small
  RAPTOR_HOME: ${{ github.workspace }}
  NEMU_HOME: ${{ github.workspace }}/nemu
  AM_HOME: ${{ github.workspace }}/abstract-machine
  CROSS_COMPILE: riscv64-elf-

jobs:
  prepare-sta:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Setup STA environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sta
      # Populate the common tool cache before the six workers start. Without
      # this dependency, a cold cache would compile OpenSTA/Slang six times.
      - name: Prepare shared STA tools and NanGate45 data
        uses: ./.github/actions/setup-sta
        with:
          platform: nangate45

  sta-analysis:
    needs: prepare-sta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - xlen: rv32
            platform: nangate45
            vflags: ""
            clk_freq_mhz: 50
          - xlen: rv64
            platform: nangate45
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
          - xlen: rv32
            platform: asap7
            vflags: ""
            clk_freq_mhz: 50
          - xlen: rv64
            platform: asap7
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
          - xlen: rv32
            platform: sky130hd
            vflags: ""
            clk_freq_mhz: 25
          - xlen: rv64
            platform: sky130hd
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
    name: sta-${{ matrix.xlen }}-${{ matrix.platform }}
    timeout-minutes: 180
    env:
      STA_LOG: /tmp/sta-${{ matrix.xlen }}-${{ matrix.platform }}.log
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sta
      - name: Setup STA tools (${{ matrix.platform }})
        uses: ./.github/actions/setup-sta
        with:
          platform: ${{ matrix.platform }}

      - name: Run STA (${{ matrix.xlen }}, ${{ matrix.platform }})
        run: |
          make sta STA_PLATFORM=${{ matrix.platform }} CLK_FREQ_MHZ=${{ matrix.clk_freq_mhz }} \
            VFLAGS="${{ matrix.vflags }}" 2>&1 | tee "$STA_LOG" | tail -256

      - name: STA summary (${{ matrix.xlen }}, ${{ matrix.platform }})
        if: always()
        run: |
          python3 .github/scripts/ci_report.py sta ${{ matrix.xlen }} ${{ matrix.platform }} "$STA_LOG" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload STA log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sta-${{ matrix.xlen }}-${{ matrix.platform }}
          path: ${{ env.STA_LOG }}
          if-no-files-found: warn
          retention-days: 14
