name: STA (PPA matrix)

# Static Timing Analysis across {rv32, rv64} × {nangate45, asap7}.
# Runs weekly to keep PPA numbers fresh without bloating PR CI.
# Manual dispatch is also supported via the Actions tab.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "hdl/**"
      - "sim/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "setup.sh"
      - "setup-rtl.sh"
      - ".github/workflows/sta.yaml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "hdl/**"
      - "sim/**"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "setup.sh"
      - "setup-rtl.sh"
      - ".github/workflows/sta.yaml"
  schedule:
    - cron: "0 20 * * 0" # Sundays 20:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAPT_CONFIG: small

jobs:
  prepare-sta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup STA environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sta
      - name: Check CI setup helpers
        run: python3 .github/scripts/test_ci_setup.py
      # Populate the common tool cache before the six workers start. Without
      # this dependency, a cold cache would compile OpenSTA/Slang six times.
      - name: Prepare shared STA tools and NanGate45 data
        uses: ./.github/actions/setup-sta
        with:
          platform: nangate45

  sta-analysis:
    needs: prepare-sta
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - xlen: rv32
            platform: nangate45
            vflags: ""
            clk_freq_mhz: 50
          - xlen: rv64
            platform: nangate45
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
          - xlen: rv32
            platform: asap7
            vflags: ""
            clk_freq_mhz: 50
          - xlen: rv64
            platform: asap7
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
          - xlen: rv32
            platform: sky130hd
            vflags: ""
            clk_freq_mhz: 25
          - xlen: rv64
            platform: sky130hd
            vflags: "-DRAPT_RV64"
            clk_freq_mhz: 25
    name: sta-${{ matrix.xlen }}-${{ matrix.platform }}
    env:
      RAPTOR_HOME: ${{ github.workspace }}
      NEMU_HOME: ${{ github.workspace }}/nemu
      AM_HOME: ${{ github.workspace }}/abstract-machine
      CROSS_COMPILE: riscv64-elf-
    steps:
      - uses: actions/checkout@v6
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          profile: sta
      - name: Setup STA tools (${{ matrix.platform }})
        uses: ./.github/actions/setup-sta
        with:
          platform: ${{ matrix.platform }}

      - name: Run STA (${{ matrix.xlen }}, ${{ matrix.platform }})
        shell: bash -l {0}
        run: |
          mkdir -p .github/results
          LOG=/tmp/sta-${{ matrix.xlen }}-${{ matrix.platform }}.log
          OUT=.github/results/sta-${{ matrix.xlen }}-${{ matrix.platform }}
          make sta STA_PLATFORM=${{ matrix.platform }} CLK_FREQ_MHZ=${{ matrix.clk_freq_mhz }} VFLAGS="${{ matrix.vflags }}" \
            2>&1 | tee "$LOG" | tail -256
          cp "$LOG" "${OUT}.log"
          bash .github/scripts/parse-benchmark.sh sta "$LOG" > "${OUT}.txt"

      - name: Generate STA summary (${{ matrix.xlen }}, ${{ matrix.platform }})
        shell: bash -l {0}
        run: |
          OUT=.github/results/sta-${{ matrix.xlen }}-${{ matrix.platform }}.txt
          read_val() {
            local key="$1"
            grep -oP "^${key}=\\K.*" "$OUT" 2>/dev/null || echo "N/A"
          }

          FREQ=$(read_val freq_mhz)
          AREA=$(read_val area)
          POWER=$(read_val power)

          {
            echo ""
            echo "## STA Results (${{ matrix.xlen }} / ${{ matrix.platform }})"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ISA    | ${{ matrix.xlen }} |"
            echo "| PDK    | ${{ matrix.platform }} |"
            echo "| Fmax   | ${FREQ} MHz |"
            echo "| Area   | ${AREA} |"
            echo "| Power  | ${POWER} W |"
          } >> "$GITHUB_STEP_SUMMARY"
