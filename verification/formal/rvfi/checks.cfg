# Raptor Chip — riscv-formal verification configuration
#
# OoO dual-issue RISC-V core (rv32imc).  NRET=2 (dual-commit).
# Uses yosys-slang plugin for SystemVerilog pack file.
#
# Usage:
#   cd verification/formal/riscv-formal/cores/raptor
#   python3 ../../checks/genchecks.py checks
#   make -C checks -j$(nproc)

[options]
isa rv32imc
nret 2
solver bmc3

# [depth] — second/last number is the BMC depth (== CHECK_CYCLE for insn).
# These are shallow smoke bounds, not architectural signoff depths. Pipeline
# changes can move retirement beyond the check cycle and produce vacuous PASS.
# Before claiming instruction correctness, require a reachable non-trapping
# retirement of that instruction on each channel at its check cycle. Consistency
# checks likewise need reachable triggering retirements within their bounds.
[depth]
insn            8
reg        1    10
pc_fwd     1    10
pc_bwd     1    10
unique     1  8 10
causal     1    10

[defines]
`define YOSYS

[script-defines]
plugin -i slang

[script-sources]
# The wrapper/testbench are read by Yosys's Verilog frontend separately.
# Select their DUT here: otherwise slang elaborates every uninstantiated pack
# module as a root, including helpers with interface ports. The later prep
# -top rvfi_testbench cannot affect this earlier slang elaboration.
read_slang --top rapt --single-unit --allow-use-before-declare @basedir@/../build/rapt_pack_rvfi.sv

[script-link]
setundef -undriven -expose

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
