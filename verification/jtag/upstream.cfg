# riscv-tests chooses ephemeral GDB/TCL ports before reading this file.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
if {[info exists ::env(RAPT_UPSTREAM_JTAG_PORT)]} {
  remote_bitbang port $::env(RAPT_UPSTREAM_JTAG_PORT)
} else {
  remote_bitbang port 9824
}
adapter speed 1000
jtag newtap raptor tap -irlen 5 -expected-id 0x10001913
target create raptor.cpu riscv -chain-position raptor.tap
riscv set_mem_access sysbus
riscv set_enable_virtual off
riscv set_enable_virt2phys off
init
halt
echo "Ready for Remote Connections"
