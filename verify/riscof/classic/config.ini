; RISCOF configuration for Raptor Chip (classic flow).
; Uses sail-riscv as reference and the Raptor sim Verilator simulator as DUT.

[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=./plugins/sail_cSim
DUTPlugin=raptor
DUTPluginPath=./plugins/raptor

[raptor]
pluginpath=./plugins/raptor
ispec=./plugins/raptor/raptor_isa.yaml
pspec=./plugins/raptor/raptor_platform.yaml
target_run=1

[sail_cSim]
pluginpath=./plugins/sail_cSim
jobs=4
