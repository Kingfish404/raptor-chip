; RISCOF configuration for NEMU (classic flow, standalone cross-check).
; Uses sail-riscv as reference and NEMU (standalone executable) as DUT.
; Shares the riscv-arch-test clone with the `classic` flow.

[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=./plugins/sail_cSim
DUTPlugin=nemu_dut
DUTPluginPath=./plugins/nemu_dut

[nemu_dut]
pluginpath=./plugins/nemu_dut
ispec=./plugins/nemu_dut/nemu_dut_isa.yaml
pspec=./plugins/nemu_dut/nemu_dut_platform.yaml
target_run=1

[sail_cSim]
pluginpath=./plugins/sail_cSim
jobs=4
