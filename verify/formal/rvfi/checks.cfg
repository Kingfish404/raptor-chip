# Raptor Chip — riscv-formal verification configuration
#
# OoO dual-issue RISC-V core (rv32imc).  NRET=2 (dual-commit).
# Uses yosys-slang plugin for SystemVerilog pack file.
#
# Usage:
#   cd verify/formal/riscv-formal/cores/raptor
#   python3 ../../checks/genchecks.py checks
#   make -C checks -j$(nproc)

[options]
isa rv32imc
nret 2
solver bmc3

# [depth] — second/last number is the BMC depth (== CHECK_CYCLE for insn).
# The Raptor pipeline is deep + out-of-order: a reachability probe (see
# rvfi_reach_check.sv / probe.sby) shows the *earliest* reset->commit on a
# channel is cycle 7, and two retired instructions need ~cycle 9.  Depths must
# therefore sit comfortably above those, otherwise the check fires before any
# instruction reaches the RVFI port and PASSes vacuously.
[depth]
insn            7
reg        1    9
pc_fwd     1    9
pc_bwd     1    9
unique     1  7 9
causal     1    9

[defines]
`define YOSYS

[script-defines]
plugin -i slang

[script-sources]
read_slang --single-unit --allow-use-before-declare --ignore-unknown-modules @basedir@/../build/rapt_pack_rvfi.sv

[script-link]
setundef -undriven -expose

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
