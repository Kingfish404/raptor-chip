# OpenOCD config template for nsim's (future) remote_bitbang JTAG bridge.
#
# Status: SCAFFOLDING. The TCP server referenced below does not exist yet.
# This file is committed so that, once nsim/csrc/jtag/remote_bitbang_server
# is implemented, OpenOCD can be pointed at it without re-discovery work.
#
# Expected wiring (per dev.jtag.md §8.1):
#   * nsim listens on TCP 127.0.0.1:9824 in remote_bitbang mode
#   * Each accepted character maps to one TCK edge with TMS/TDI per the
#     standard OpenOCD remote_bitbang protocol:
#       '0'..'7' -> drive {TRSTn,TMS,TDI}_lo, pulse TCK
#       'R'      -> read TDO
#       't'      -> "test/idle" sync (no-op, optional)
#       'B','b'  -> LED on/off (ignore in sim)
#       'r'/'s'  -> assert/deassert SRST (currently ignored)
#
# Bring-up sequence once the bridge exists:
#   1. Build nsim with -DRAPT_JTAG and start in --jtag-server mode
#   2. openocd -f verify/jtag/openocd.cfg
#   3. riscv32-elf-gdb (gdb) target extended-remote :3333
#   4. cd verify/jtag/riscv-tests/debug && ./gdbserver.py ...
#
# Until then `make debug-tests` will print a checklist and exit non-zero.

adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824

# RISC-V TAP. IDCODE matches rapt_dtm:RAPT_DTM_IDCODE = 0x10001913.
# IR length = 5 (Debug Spec). IDCODE/DTMCS/DMI/BYPASS = 0x01/0x10/0x11/0x1F.
set _CHIPNAME raptor
jtag newtap $_CHIPNAME tap -irlen 5 -expected-id 0x10001913

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_CHIPNAME.tap

# Speed is irrelevant for remote_bitbang but OpenOCD insists on a value.
adapter speed 1000

init
halt
