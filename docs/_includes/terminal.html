<div class="term" id="term">
  <div class="term-bar">
    <span class="term-title">command lookup</span>
    <span class="term-hint">Makefile + RTL reference</span>
    <button type="button" class="term-close" data-term-close aria-label="Close command lookup">close</button>
  </div>
  <div class="term-out" id="term-out" role="log" aria-live="polite"></div>
  <form class="term-in" id="term-form" autocomplete="off">
    <label for="term-input">raptor$</label>
    <input id="term-input" name="cmd" spellcheck="false" autocapitalize="off" autocomplete="off">
  </form>
</div>
