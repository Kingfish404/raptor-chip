<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="Jekyll">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>
  {% if site.description %}
  <meta name="description" content="{{ page.description | default: site.description }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}"><strong>Raptor</strong></a>
    <a href="{{ '/getting-started.html' | relative_url }}">Quick Start</a>
    <a href="{{ '/uarch.html' | relative_url }}">Microarchitecture</a>
    <a href="{{ '/perf-iterations.html' | relative_url }}">Perf Iterations</a>
    <a href="{{ '/ecosystem.html' | relative_url }}">Ecosystem</a>
    <a href="{{ '/linux_kernel.html' | relative_url }}">Linux</a>
    <a href="https://github.com/Kingfish404/raptor-chip" rel="external">GitHub</a>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p>
      Licensed under the
      <a href="https://github.com/Kingfish404/raptor-chip/blob/master/LICENSE">Apache License 2.0</a>.
      {% if page.path %}
      <a href="https://github.com/Kingfish404/raptor-chip/edit/master/docs/{{ page.path }}">Edit this page</a>.
      {% endif %}
    </p>
  </footer>
</body>

</html>
