<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  {% include head.html %}
</head>
<body data-portal="{{ '/assets/generated/portal-data.json' | relative_url }}">
  {% include nav.html %}
  <div class="page-wrap">
    <aside class="toc" id="toc" hidden></aside>
    <main id="content" class="article">
      {{ content }}
    </main>
  </div>
  <footer class="site-footer">
    <p>
      Licensed under the
      <a href="https://github.com/Kingfish404/raptor-chip/blob/master/LICENSE">Apache License 2.0</a>.
      {% if page.path %}
      <a href="https://github.com/Kingfish404/raptor-chip/edit/master/docs/{{ page.path }}">Edit this page</a>.
      {% endif %}
    </p>
  </footer>
  {% include terminal.html %}
  {% include scripts.html %}
</body>
</html>
