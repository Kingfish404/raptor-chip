title: Raptor
description: A super-scalar, out-of-order RISC-V processor core
url: https://kingfish404.github.io
# Project Pages live under /raptor-chip. `relative_url` then prefixes assets
# and in-site links. Local preview is http://localhost:4000/raptor-chip/.
baseurl: "/raptor-chip"
# Jekyll processing is enabled by default; set `markdown: kramdown` for tables etc.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
relative_links:
  enabled: true
  collections: true
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true
  with_frontmatter: true

# Apply the theme layout + `relative_links` processing to every .md file
# without requiring YAML front-matter on each one.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

include:
  - README.md
exclude:
  - ref.tmp
  - .gitignore
  - Makefile
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts
